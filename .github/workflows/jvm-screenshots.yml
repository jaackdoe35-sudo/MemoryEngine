name: JVM Screenshots

on:
  push:
    branches: [ main, Main, task-11-final-audit ]
  pull_request:
    branches: [ main, Main ]

jobs:
  screenshots:
    name: Run JVM Screenshot Tests & Save Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Roborazzi JVM Screenshot Tests
        run: ./gradlew recordRoborazziDebug testDebugUnitTest

      - name: Upload Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jvm-screenshots
          path: docs/screenshots/*.png
